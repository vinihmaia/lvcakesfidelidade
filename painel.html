<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F4FA">
<title>Painel | LV Cakes</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-title" content="Painel LV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  /* ===== Tema holográfico claro ===== */
  :root{
    --ink:#14141F; --soft:#6B6B80; --line:#E6E7F2;
    --choc:#14141F;    /* escuro: barra de baixo e filtros ativos */
    --peach:#ECEDF6;   /* lavanda clara: fundos de botões e barras */
    --peach2:#C9BEFF;  /* lilás: contornos */
    --acc:#7B5CFF;     /* violeta: destaques */
    --cream:#F3F4FA; --cream-t:#9A9AB0;
    --ok:#0E9F6E; --okbg:#E1F7EF; --bad:#E5484D; --badbg:#FDECEC;
    --warn:#B26A00; --warnbg:#FFF3DC; --blue:#3B5BDB; --bluebg:#E7ECFF;
    --holo:linear-gradient(90deg,#7B5CFF,#FF5CA8,#FF8A3D);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{background:#F3F4FA}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;letter-spacing:-0.01em;
       background:radial-gradient(700px 320px at 0% -5%,rgba(123,92,255,.13),transparent 70%),
                  radial-gradient(600px 320px at 100% 0%,rgba(255,92,168,.10),transparent 70%),#F3F4FA}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}

  /* Cartões */
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;
        box-shadow:0 1px 2px rgba(20,20,31,.04),0 10px 30px -12px rgba(20,20,31,.08)}

  /* Botões */
  .btn{border-radius:14px;padding:12px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-p{background:linear-gradient(90deg,#7B5CFF,#FF5CA8);color:#fff;box-shadow:0 6px 18px -6px rgba(123,92,255,.55)}
  .btn-ok{background:linear-gradient(90deg,#0E9F6E,#14C8A0);color:#fff;box-shadow:0 6px 18px -6px rgba(14,159,110,.5)}
  .btn-s{background:var(--peach);color:var(--ink)}
  .btn-l{color:var(--soft);font-size:13px;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}

  /* Filtros */
  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  /* Fila de pedidos */
  .bloco{font-size:13px;font-weight:700;color:var(--acc);margin:22px 0 8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
  .ped{margin-bottom:10px}
  .ped.novo{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .e-novo{background:#F0EBFF;color:#5B3FE0}
  .e-preparo{background:var(--warnbg);color:var(--warn)}
  .e-saiu{background:var(--bluebg);color:var(--blue)}
  .e-entregue,.pg-ok{background:var(--okbg);color:var(--ok)}
  .e-cancelado{background:var(--badbg);color:var(--bad)}
  .pg-no{background:var(--warnbg);color:var(--warn)}
  .meta{font-size:13px;color:var(--soft)}
  .atraso{color:var(--bad);font-weight:700}
  .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .acoes .full{grid-column:span 2}
  .extra{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:4px}

  /* Números e resumos */
  .metr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .metr .largo{grid-column:span 2;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--holo) border-box}
  .rot{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
  .val{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-top:4px}
  h2{font-size:16px;font-weight:700;margin:26px 0 10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
  th{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .barra{height:8px;border-radius:99px;background:var(--peach);overflow:hidden;margin:5px 0 12px}
  .barra div{height:100%;background:var(--holo);border-radius:99px}
  .graf{display:flex;align-items:flex-end;gap:8px;height:120px}
  .graf .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--soft);font-family:var(--mono)}
  .graf .b{width:100%;background:#DDD5FF;border-radius:8px 8px 3px 3px;min-height:2px}
  .graf .col.hoje .b{background:linear-gradient(180deg,#FF5CA8,#7B5CFF)}
  .linha-rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

  /* Barra de navegação flutuante */
  .nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
       background:rgba(20,20,31,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#9A9AB0;
       display:flex;justify-content:space-around;padding:8px 4px;border-radius:22px;z-index:10;box-shadow:0 12px 30px -10px rgba(20,20,31,.5)}
  .nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px;padding:4px 8px;position:relative;opacity:.7;flex:1}
  .nav button.on{opacity:1;color:#fff}
  .nav button.on::after{content:"";width:16px;height:3px;border-radius:3px;background:var(--holo);margin-top:2px}
  .nav i{font-size:22px}
  .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:linear-gradient(90deg,#FF5CA8,#FF8A3D);color:#fff;font-size:11px;font-weight:700;font-family:var(--mono);
         min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* Aviso de pedido novo */
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#7B5CFF,#FF5CA8);color:#fff;padding:12px 20px;border-radius:16px;
         font-weight:700;z-index:20;box-shadow:0 10px 30px -8px rgba(123,92,255,.6);display:none;align-items:center;gap:8px}

  /* Formulários */
  input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);margin-top:6px}
  input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(123,92,255,.15)}
  .err{color:var(--bad);font-size:14px;margin-top:10px}
  .okmsg{color:var(--ok);font-size:14px;margin-top:10px}
  .vazio{text-align:center;color:var(--soft);padding:28px 16px}

  @media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<button class="toast" id="toast"></button>

<div class="wrap">
  <!-- LOGIN -->
  <div id="tela-login" style="display:none;max-width:380px;margin:60px auto 0">
    <div style="font-size:28px;font-weight:700">Painel LV Cakes</div>
    <div class="meta" style="margin-top:4px;font-size:15px">Entre com o e-mail e a senha criados no Supabase.</div>
    <form id="form-login" class="card" style="margin-top:20px">
      <label class="meta">E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label class="meta" style="display:block;margin-top:12px">Senha<input id="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-p" style="width:100%;margin-top:16px" id="entrar">Entrar</button>
      <div class="err" id="e-login"></div>
    </form>
  </div>

  <!-- APP -->
  <div id="tela-app" style="display:none">
    <div style="display:flex;align-items:center;gap:6px">
      <div style="flex:1;min-width:0">
        <div style="font-size:24px;font-weight:700;line-height:1.05" id="titulo">Fila de entrega</div>
        <div class="meta" id="atualizado"></div>
      </div>
      <button class="btn btn-s" id="som" aria-label="Som de pedido novo"><i class="ti ti-bell"></i></button>
      <button class="btn btn-s" id="recarregar" aria-label="Atualizar agora"><i class="ti ti-refresh"></i></button>
      <button class="btn-l" id="sair">Sair</button>
    </div>
    <div class="err" id="e-painel"></div>

    <section id="aba-fila"></section>
    <section id="aba-fin" style="display:none"></section>

    <!-- DESPESAS: o formulário fica fixo para não apagar o que você está digitando quando o painel atualiza -->
    <section id="aba-desp" style="display:none">
      <div id="desp-resumo"></div>
      <form id="form-desp" class="card" style="margin-top:14px">
        <div style="font-weight:700;font-size:16px">Nova despesa</div>
        <label class="meta" style="display:block;margin-top:10px">O que foi
          <input id="d-desc" maxlength="80" placeholder="Ex.: leite condensado, potes, gás" required></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
          <label class="meta">Valor (R$)<input id="d-valor" inputmode="decimal" placeholder="25,90" required></label>
          <label class="meta">Data<input id="d-data" type="date" required></label>
        </div>
        <div class="meta" style="margin-top:12px">Categoria</div>
        <div class="cats" id="d-cats"></div>
        <button type="submit" class="btn btn-p" style="width:100%;margin-top:14px" id="d-salvar"><i class="ti ti-plus"></i>Adicionar despesa</button>
        <div id="d-msg"></div>
      </form>
      <div id="desp-lista"></div>
    </section>

    <section id="aba-cli" style="display:none"></section>
  </div>
</div>

<nav class="nav" id="nav" style="display:none">
  <button data-aba="fila" class="on"><i class="ti ti-truck-delivery"></i>Fila<span class="badge" id="badge" style="display:none"></span></button>
  <button data-aba="fin"><i class="ti ti-cash"></i>Financeiro</button>
  <button data-aba="desp"><i class="ti ti-receipt"></i>Despesas</button>
  <button data-aba="cli"><i class="ti ti-users"></i>Clientes</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  /* Mesma chave pública do site. Quem protege os dados é o banco (função painel_checa). */
  const SUPABASE_URL = "https://kbwhmketsipuciygklkg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_SaOAF_gTTG9tqDTo2Dax9g_aZ4NA-JQ";
  const ATUALIZAR_A_CADA = 20;   // segundos
  const ATRASO_MIN = 45;         // minutos para o pedido ficar vermelho
  const DIAS_CARREGADOS = 62;    // ~2 meses (para "Este mês" e "Mês passado")
  const CATEGORIAS = ["Ingredientes", "Embalagens", "Entrega", "Gás e energia", "Divulgação", "Outros"];

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const brl = v => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  // Protege o painel: textos digitados nunca viram código
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const mesmoDia = (a, b) => a.toDateString() === b.toDateString();
  const hora = d => new Date(d).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const diaHora = d => { const x = new Date(d); return (mesmoDia(x, new Date()) ? "hoje" : x.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })) + " " + hora(x); };
  const minDesde = d => Math.floor((Date.now() - new Date(d)) / 60000);
  const ha = d => { const m = minDesde(d); return m < 1 ? "agora" : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}` : diaHora(d); };
  const potesDe = p => (p.itens || []).reduce((s, i) => s + Number(i.qtd || 0), 0);
  const ETAPA = p => p.status === "pendente" ? (p.etapa === "saiu" ? "saiu" : p.etapa === "preparo" ? "preparo" : "novo")
                   : (p.status === "entregue" ? "entregue" : "cancelado");
  const NOME = { novo: "Novo", preparo: "Preparando", saiu: "A caminho", entregue: "Entregue", cancelado: "Cancelado" };
  const hojeISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dataDesp = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  // Aceita "25,90", "25.90", "1.234,56" e "R$ 25,90"
  const lerValor = s => {
    s = String(s).trim().replace(/[R$\s]/g, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = Number(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  };

  let pedidos = [], ranking = null, despesas = [], despErro = "";
  let aba = "fila", filtro = "todos", periodo = "mes", catSel = CATEGORIAS[0];
  let timer = null, carregando = false, deNovo = false, conhecidos = null;
  let somLigado = localStorage.getItem("lv_som") !== "off";

  /* ---------- Períodos (Financeiro e Despesas) ---------- */
  const PERIODOS = [["hoje", "Hoje"], ["7", "7 dias"], ["mes", "Este mês"], ["passado", "Mês passado"]];
  function dentroPeriodo(d){
    const n = new Date();
    if (periodo === "hoje") return mesmoDia(d, n);
    if (periodo === "7") return d >= new Date(n.getFullYear(), n.getMonth(), n.getDate() - 6);
    let y = n.getFullYear(), m = n.getMonth();
    if (periodo === "passado") { m--; if (m < 0) { m = 11; y--; } }
    return d.getFullYear() === y && d.getMonth() === m;
  }
  const chipsPeriodo = () => `<div class="chips">${PERIODOS.map(([id, rot]) =>
    `<button class="chip${periodo === id ? " on" : ""}" data-periodo="${id}">${rot}</button>`).join("")}</div>`;
  const somaTotal = l => l.reduce((s, p) => s + Number(p.total || 0), 0);
  const somaValor = l => l.reduce((s, d) => s + Number(d.valor || 0), 0);
  const vendasPeriodo = () => pedidos.filter(p => p.status !== "cancelado" && dentroPeriodo(new Date(p.criado_em)));
  const despesasPeriodo = () => despesas.filter(d => dentroPeriodo(dataDesp(d.data)));

  /* ---------- Login ---------- */
  async function iniciar(){
    const { data: { session } } = await db.auth.getSession();
    session ? abrirApp() : abrirLogin();
  }
  function abrirLogin(){
    clearInterval(timer);
    $("tela-app").style.display = "none"; $("nav").style.display = "none";
    $("tela-login").style.display = "block";
    document.title = "Painel | LV Cakes";
  }
  function abrirApp(){
    $("tela-login").style.display = "none";
    $("tela-app").style.display = "block"; $("nav").style.display = "flex";
    if (!$("d-data").value) $("d-data").value = hojeISO();
    renderCats(); atualizarSom(); carregar();
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) carregar(); }, ATUALIZAR_A_CADA * 1000);
  }
  $("form-login").onsubmit = async e => {
    e.preventDefault();
    $("e-login").textContent = "";
    $("entrar").disabled = true; $("entrar").textContent = "Entrando…";
    const { error } = await db.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
    $("entrar").disabled = false; $("entrar").textContent = "Entrar";
    if (error) { $("e-login").textContent = "E-mail ou senha incorretos."; return; }
    $("senha").value = "";
    abrirApp();
  };
  $("sair").onclick = async () => { await db.auth.signOut(); abrirLogin(); };
  $("recarregar").onclick = () => carregar();
  db.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") abrirLogin(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden && $("tela-app").style.display === "block") carregar(); });

  /* ---------- Som e aviso de pedido novo ---------- */
  let audio = null;
  function liberarAudio(){
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) {}
  }
  document.addEventListener("click", liberarAudio);
  document.addEventListener("touchstart", liberarAudio, { passive: true });
  function bip(){
    if (!somLigado || !audio) return;
    [0, 0.22, 0.6, 0.82].forEach((t, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), s = audio.currentTime + t;
      o.frequency.value = i % 2 ? 1046 : 784;
      o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.4, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.start(s); o.stop(s + 0.22);
    });
  }
  function atualizarSom(){ $("som").innerHTML = `<i class="ti ${somLigado ? "ti-bell-ringing" : "ti-bell-off"}"></i>`; }
  $("som").onclick = () => {
    somLigado = !somLigado;
    localStorage.setItem("lv_som", somLigado ? "on" : "off");
    atualizarSom(); liberarAudio();
    if (somLigado) bip();   // toca uma vez para você testar
  };
  function avisarNovos(n){
    bip();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    const t = $("toast");
    t.innerHTML = `<i class="ti ti-bell-ringing"></i>${n > 1 ? n + " pedidos novos!" : "Pedido novo!"}`;
    t.style.display = "flex";
    clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 6000);
  }
  $("toast").onclick = () => { $("toast").style.display = "none"; filtro = "novo"; trocarAba("fila"); };
  function checarNovos(){
    const ids = new Set(pedidos.filter(p => p.status === "pendente").map(p => p.id));
    if (conhecidos) {
      const novos = [...ids].filter(id => !conhecidos.has(id));
      if (novos.length) avisarNovos(novos.length);
    }
    conhecidos = ids;
  }

  /* ---------- Carregar ---------- */
  async function carregar(){
    if (carregando) { deNovo = true; return; }
    carregando = true;
    try {
      const [p, r, d] = await Promise.all([
        db.rpc("painel_pedidos", { p_dias: DIAS_CARREGADOS }),
        db.rpc("painel_ranking"),
        db.rpc("painel_despesas", { p_dias: DIAS_CARREGADOS })
      ]);
      if (p.error) { mostrarErro(p.error); return; }
      pedidos = p.data || [];
      ranking = r.error ? null : r.data;
      if (d.error) {
        despesas = [];
        despErro = /function|schema cache/i.test(d.error.message || "")
          ? "Rode o SQL das despesas no Supabase para usar esta aba."
          : "Não foi possível carregar as despesas: " + d.error.message;
      } else { despesas = d.data || []; despErro = ""; }
      $("e-painel").textContent = (pedidos.length && !("pago" in pedidos[0]))
        ? "Falta rodar o SQL da etapa e do pagamento no Supabase." : "";
      checarNovos();
      render();
      $("atualizado").textContent = "Atualizado às " + hora(new Date());
    } finally {
      carregando = false;
      if (deNovo) { deNovo = false; carregar(); }
    }
  }
  function mostrarErro(err){
    const m = err.message || "";
    if (/Acesso negado/i.test(m)) $("e-painel").textContent = "Este usuário não tem acesso ao painel. Confira o UID no SQL.";
    else if (/function|schema cache/i.test(m)) $("e-painel").textContent = "Funções do painel não encontradas. Rode o SQL do painel no Supabase.";
    else $("e-painel").textContent = "Não foi possível carregar: " + m;
  }

  /* ---------- Abas ---------- */
  function trocarAba(a){
    aba = a;
    [...$("nav").children].forEach(b => b.classList.toggle("on", b.dataset.aba === a));
    ["fila", "fin", "desp", "cli"].forEach(x => $("aba-" + x).style.display = x === a ? "block" : "none");
    render(); window.scrollTo(0, 0);
  }
  $("nav").onclick = e => { const b = e.target.closest("[data-aba]"); if (b) trocarAba(b.dataset.aba); };

  function render(){
    const abertos = pedidos.filter(p => p.status === "pendente").length;
    $("badge").style.display = abertos ? "flex" : "none";
    $("badge").textContent = abertos;
    document.title = (abertos ? `(${abertos}) ` : "") + "Painel | LV Cakes";
    if (aba === "fila") { $("titulo").textContent = abertos ? `${abertos} para entregar` : "Fila de entrega"; renderFila(); }
    if (aba === "fin")  { $("titulo").textContent = "Financeiro"; renderFin(); }
    if (aba === "desp") { $("titulo").textContent = "Despesas"; renderDesp(); }
    if (aba === "cli")  { $("titulo").textContent = "Clientes"; renderCli(); }
  }

  /* ---------- Cartão de pedido ---------- */
  function cartao(p, mostrarBloco){
    const e = ETAPA(p);
    const atrasado = p.status === "pendente" && minDesde(p.criado_em) >= ATRASO_MIN;
    const itens = (p.itens || []).map(i => `<b>${esc(i.qtd)}x</b> ${esc(i.sabor)}`).join("<br>");
    const pag = p.pago
      ? `<span class="pill pg-ok"><i class="ti ti-check"></i>Pago · ${esc(p.pagamento)}</span>`
      : `<span class="pill pg-no"><i class="ti ti-clock"></i>${esc(p.pagamento)} · a receber</span>`;
    const troco = (p.troco && !p.pago) ? `<span class="meta">troco p/ R$ ${esc(p.troco)}</span>` : "";
    const brinde = p.usou_brinde ? `<span class="pill e-novo"><i class="ti ti-gift"></i>pote grátis</span>` : "";

    const B = (acao, txt, cls) => ({ acao, txt, cls });
    let bts = [], ext = [];
    if (e === "novo") {
      bts.push(B("preparar", "<i class='ti ti-chef-hat'></i>Começar preparo", "btn-p"));
      if (!p.pago) bts.push(B("pago", "<i class='ti ti-cash'></i>Confirmar pagamento", "btn-s"));
      ext.push(B("saiu", "Pular para a entrega"), B("cancelar", "Cancelar pedido"));
    } else if (e === "preparo") {
      bts.push(B("saiu", "<i class='ti ti-truck-delivery'></i>Saiu para entrega", "btn-p"));
      if (!p.pago) bts.push(B("pago", "<i class='ti ti-cash'></i>Confirmar pagamento", "btn-s"));
      ext.push(B("voltar", "Voltar etapa"), B("cancelar", "Cancelar pedido"));
    } else if (e === "saiu") {
      if (p.pago) bts.push(B("entregue", "<i class='ti ti-check'></i>Entregue", "btn-ok"));
      else bts.push(B("entregue_pago", "<i class='ti ti-check'></i>Entregue e pago", "btn-ok"),
                    B("entregue", "Entregue, pagar depois", "btn-s"));
      ext.push(B("voltar", "Voltar etapa"));
    } else if (e === "entregue") {
      if (!p.pago) bts.push(B("pago", "<i class='ti ti-cash'></i>Confirmar pagamento", "btn-ok"));
      ext.push(B("desfazer_entrega", "Desfazer entrega"));
      if (p.pago) ext.push(B("nao_pago", "Marcar como não pago"));
    } else {
      ext.push(B("reabrir", "Reabrir pedido"));
    }
    const html = b => `<button class="btn ${b.cls}${bts.length === 1 ? " full" : ""}" data-id="${esc(p.id)}" data-acao="${b.acao}">${b.txt}</button>`;
    const link = b => `<button class="btn-l" data-id="${esc(p.id)}" data-acao="${b.acao}">${b.txt}</button>`;
    const titulo = mostrarBloco ? `Bloco ${esc(p.bloco)} · apto ${esc(p.apto)}` : `Apto ${esc(p.apto)}`;

    return `<div class="card ped ${e === "novo" ? "novo" : ""}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div style="min-width:0">
          <div style="font-size:18px;font-weight:700;line-height:1.2">${titulo} · ${esc(p.nome)}</div>
          <div class="meta">Nº ${esc(p.id)} · ${esc(hora(p.criado_em))} · <span class="${atrasado ? "atraso" : ""}">${esc(ha(p.criado_em))}</span></div>
        </div>
        <div style="text-align:right;flex:none">
          <div style="font-size:19px;font-weight:700;white-space:nowrap;font-family:var(--mono)">${brl(p.total)}</div>
          <span class="pill e-${e}">${NOME[e]}</span>
        </div>
      </div>
      <div style="font-size:15px;margin:8px 0;line-height:1.5">${itens}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">${pag}${brinde}${troco}</div>
      ${bts.length ? `<div class="acoes">${bts.map(html).join("")}</div>` : ""}
      ${ext.length ? `<div class="extra">${ext.map(link).join("")}</div>` : ""}
    </div>`;
  }

  /* ---------- Aba Fila ---------- */
  function renderFila(){
    const hoje = new Date();
    const abertos = pedidos.filter(p => p.status === "pendente");
    const feitos = pedidos.filter(p => p.status !== "pendente" && mesmoDia(new Date(p.entregue_em || p.criado_em), hoje));
    const n = k => abertos.filter(p => ETAPA(p) === k).length;
    const opcoes = [["todos", "Em aberto", abertos.length], ["novo", "Novos", n("novo")], ["preparo", "Preparando", n("preparo")],
                    ["saiu", "A caminho", n("saiu")], ["feitos", "Concluídos hoje", feitos.length]];
    let h = `<div class="chips">${opcoes.map(([id, rot, c]) =>
      `<button class="chip${filtro === id ? " on" : ""}" data-filtro="${id}">${rot} (${c})</button>`).join("")}</div>`;

    if (filtro === "feitos") {
      const l = feitos.slice().sort((a, b) => new Date(b.entregue_em || b.criado_em) - new Date(a.entregue_em || a.criado_em));
      h += l.length ? `<div style="margin-top:12px">${l.map(p => cartao(p, true)).join("")}</div>`
                    : `<div class="card vazio" style="margin-top:12px">Nada concluído hoje ainda.</div>`;
    } else {
      const l = abertos.filter(p => filtro === "todos" || ETAPA(p) === filtro);
      if (!l.length) {
        h += `<div class="card vazio" style="margin-top:12px">${abertos.length ? "Nenhum pedido nesta etapa." : "Nenhum pedido em aberto. Tudo entregue! 🎉"}</div>`;
      } else {
        const grupos = {};
        l.forEach(p => { (grupos[p.bloco] = grupos[p.bloco] || []).push(p); });
        const blocos = Object.keys(grupos).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0) || a.localeCompare(b));
        blocos.forEach(b => {
          const ps = grupos[b].sort((x, y) => new Date(x.criado_em) - new Date(y.criado_em));
          const total = ps.reduce((s, p) => s + potesDe(p), 0);
          h += `<div class="bloco"><i class="ti ti-building"></i>Bloco ${esc(b)}
                <span class="meta" style="font-weight:500;text-transform:none;letter-spacing:0">· ${ps.length} pedido${ps.length > 1 ? "s" : ""}, ${total} pote${total > 1 ? "s" : ""}</span></div>`;
          h += ps.map(p => cartao(p, false)).join("");
        });
      }
    }
    h += `<div class="meta" style="margin-top:14px;text-align:center">O carimbo do cliente só conta quando o pedido é marcado como entregue.</div>`;
    $("aba-fila").innerHTML = h;
  }
  $("aba-fila").addEventListener("click", e => {
    const b = e.target.closest("[data-filtro]"); if (!b) return;
    filtro = b.dataset.filtro; renderFila();
  });

  /* ---------- Aba Financeiro ---------- */
  function renderFin(){
    const l = vendasPeriodo();
    const vendido = somaTotal(l), recebido = somaTotal(l.filter(p => p.pago));
    const gasto = somaValor(despesasPeriodo());
    const lucro = vendido - gasto;
    const brindes = l.filter(p => p.usou_brinde);
    const potes = l.reduce((s, p) => s + potesDe(p), 0);

    let h = chipsPeriodo();
    h += `<div class="metr">
      <div class="card"><div class="rot">Vendido</div><div class="val">${brl(vendido)}</div><div class="meta">${l.length} pedidos · ${potes} potes</div></div>
      <div class="card"><div class="rot">Recebido</div><div class="val" style="color:var(--ok)">${brl(recebido)}</div><div class="meta">pagamentos confirmados</div></div>
      <div class="card"><div class="rot">A receber</div><div class="val" style="color:var(--warn)">${brl(vendido - recebido)}</div><div class="meta">${l.filter(p => !p.pago).length} pedidos</div></div>
      <div class="card"><div class="rot">Despesas</div><div class="val" style="color:var(--bad)">${brl(gasto)}</div><div class="meta">${despErro ? "aba Despesas não configurada" : despesasPeriodo().length + " lançamentos"}</div></div>
      <div class="card largo"><div class="rot">Lucro estimado (vendido − despesas)</div>
        <div class="val" style="color:${lucro >= 0 ? "var(--ok)" : "var(--bad)"};font-size:28px">${brl(lucro)}</div>
        <div class="meta">${vendido ? Math.round(lucro / vendido * 100) + "% do que foi vendido · " : ""}${brindes.length} pote${brindes.length === 1 ? "" : "s"} grátis dado${brindes.length === 1 ? "" : "s"} (${brl(brindes.reduce((s, p) => s + Number(p.desconto || 0), 0))})</div></div>
    </div>`;

    // Por forma de pagamento
    h += `<h2>Por forma de pagamento</h2><div class="card"><table>
      <tr><th>Forma</th><th>Recebido</th><th>A receber</th></tr>
      ${["Pix", "Crédito", "Dinheiro"].map(f => {
        const x = l.filter(p => p.pagamento === f);
        return `<tr><td><b>${f}</b> <span class="meta">(${x.length})</span></td><td style="color:var(--ok);font-family:var(--mono)">${brl(somaTotal(x.filter(p => p.pago)))}</td><td style="color:var(--warn);font-family:var(--mono)">${brl(somaTotal(x.filter(p => !p.pago)))}</td></tr>`;
      }).join("")}
    </table></div>`;

    // Gráfico dos últimos 7 dias
    const validos = pedidos.filter(p => p.status !== "cancelado");
    const dias = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      dias.push({ d, v: somaTotal(validos.filter(p => mesmoDia(new Date(p.criado_em), d))) });
    }
    const max = Math.max(1, ...dias.map(x => x.v));
    const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    h += `<h2>Vendas dos últimos 7 dias</h2><div class="card"><div class="graf">
      ${dias.map((x, i) => `<div class="col${i === 6 ? " hoje" : ""}" title="${brl(x.v)}">
        <span>${x.v ? Math.round(x.v) : ""}</span><div class="b" style="height:${Math.round(x.v / max * 80)}%"></div><span>${SEM[x.d.getDay()]}</span></div>`).join("")}
    </div></div>`;

    // Pagamentos a confirmar (todos dos últimos 2 meses)
    const pend = validos.filter(p => !p.pago).sort((a, b) => new Date(a.criado_em) - new Date(b.criado_em));
    h += `<h2>Pagamentos a confirmar <span class="meta">(últimos 2 meses)</span></h2><div class="card">`;
    h += pend.length ? pend.map(p => `<div class="linha-rec">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(p.nome)} · B${esc(p.bloco)}/${esc(p.apto)}</div>
          <div class="meta">Nº ${esc(p.id)} · ${esc(diaHora(p.criado_em))} · ${esc(p.pagamento)} · ${NOME[ETAPA(p)]}</div>
        </div>
        <div style="font-weight:700;white-space:nowrap;font-family:var(--mono)">${brl(p.total)}</div>
        <button class="btn btn-ok" data-id="${esc(p.id)}" data-acao="pago" aria-label="Confirmar pagamento do pedido ${esc(p.id)}"><i class="ti ti-check"></i></button>
      </div>`).join("") : `<div class="vazio">Tudo recebido. 💰</div>`;
    h += `</div>`;

    // Sabores do período
    const cont = {};
    l.forEach(p => (p.itens || []).forEach(i => { cont[i.sabor] = (cont[i.sabor] || 0) + Number(i.qtd || 0); }));
    const sab = Object.entries(cont).sort((a, b) => b[1] - a[1]);
    h += `<h2>Sabores mais vendidos</h2><div class="card">`;
    h += sab.length ? sab.map(([nome, q]) =>
      `<div style="display:flex;justify-content:space-between;font-size:15px"><span>${esc(nome)}</span><b>${q} pote${q === 1 ? "" : "s"}</b></div>
       <div class="barra"><div style="width:${Math.round(q / sab[0][1] * 100)}%"></div></div>`).join("")
      : `<div class="vazio">Sem vendas no período.</div>`;
    h += `</div>`;

    $("aba-fin").innerHTML = h;
  }

  /* ---------- Aba Despesas ---------- */
  function renderCats(){
    $("d-cats").innerHTML = CATEGORIAS.map(c =>
      `<button type="button" class="chip${c === catSel ? " on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  }
  $("d-cats").onclick = e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    catSel = b.dataset.cat; renderCats();
  };

  function renderDesp(){
    let r = chipsPeriodo();
    if (despErro) {
      $("desp-resumo").innerHTML = r + `<div class="card vazio" style="margin-top:12px">${esc(despErro)}</div>`;
      $("desp-lista").innerHTML = "";
      return;
    }
    const l = despesasPeriodo();
    const gasto = somaValor(l), vendido = somaTotal(vendasPeriodo()), lucro = vendido - gasto;
    r += `<div class="metr">
      <div class="card"><div class="rot">Vendido</div><div class="val">${brl(vendido)}</div></div>
      <div class="card"><div class="rot">Despesas</div><div class="val" style="color:var(--bad)">${brl(gasto)}</div></div>
      <div class="card largo"><div class="rot">Lucro estimado</div>
        <div class="val" style="color:${lucro >= 0 ? "var(--ok)" : "var(--bad)"};font-size:28px">${brl(lucro)}</div>
        <div class="meta">${vendido ? "Sobram " + Math.round(lucro / vendido * 100) + "% de cada real vendido" : "Sem vendas no período"}</div></div>
    </div>`;
    $("desp-resumo").innerHTML = r;

    // Por categoria
    let h = "";
    const porCat = {};
    l.forEach(d => { porCat[d.categoria] = (porCat[d.categoria] || 0) + Number(d.valor || 0); });
    const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
    if (cats.length) {
      h += `<h2>Por categoria</h2><div class="card">` + cats.map(([c, v]) =>
        `<div style="display:flex;justify-content:space-between;font-size:15px"><span>${esc(c)}</span><b style="font-family:var(--mono)">${brl(v)}</b></div>
         <div class="barra"><div style="width:${Math.round(v / cats[0][1] * 100)}%;background:var(--bad)"></div></div>`).join("") + `</div>`;
    }

    // Lista
    h += `<h2>Lançamentos</h2><div class="card">`;
    h += l.length ? l.map(d => `<div class="linha-rec">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700">${esc(d.descricao)}</div>
          <div class="meta">${esc(dataDesp(d.data).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }))} · ${esc(d.categoria)}</div>
        </div>
        <div style="font-weight:700;white-space:nowrap;color:var(--bad);font-family:var(--mono)">${brl(d.valor)}</div>
        <button class="btn btn-s" data-apagar="${esc(d.id)}" data-desc="${esc(d.descricao)}" aria-label="Apagar despesa"><i class="ti ti-trash"></i></button>
      </div>`).join("") : `<div class="vazio">Nenhuma despesa lançada neste período.</div>`;
    h += `</div>`;
    $("desp-lista").innerHTML = h;
  }

  $("form-desp").onsubmit = async e => {
    e.preventDefault();
    const desc = $("d-desc").value.trim(), valor = lerValor($("d-valor").value), data = $("d-data").value || hojeISO();
    const msg = t => { $("d-msg").className = "err"; $("d-msg").textContent = t; };
    if (!desc) return msg("Escreva o que foi a despesa.");
    if (!(valor > 0)) return msg("Digite um valor válido, por exemplo 25,90.");
    $("d-salvar").disabled = true; $("d-salvar").textContent = "Salvando…";
    const { error } = await db.rpc("painel_despesa_salvar", { p_data: data, p_descricao: desc, p_categoria: catSel, p_valor: valor });
    $("d-salvar").disabled = false; $("d-salvar").innerHTML = '<i class="ti ti-plus"></i>Adicionar despesa';
    if (error) {
      return msg(/function|schema cache/i.test(error.message || "")
        ? "Rode o SQL das despesas no Supabase primeiro."
        : "Não deu para salvar: " + error.message);
    }
    $("d-desc").value = ""; $("d-valor").value = "";
    $("d-msg").className = "okmsg"; $("d-msg").textContent = `Despesa de ${brl(valor)} adicionada.`;
    setTimeout(() => { $("d-msg").textContent = ""; }, 4000);
    carregar();
  };

  /* ---------- Aba Clientes ---------- */
  function renderCli(){
    let h = `<h2 style="margin-top:14px">Clientes mais fiéis</h2><div class="card" style="overflow-x:auto">`;
    if (!ranking) h += `<div class="vazio">Não foi possível carregar o ranking.</div>`;
    else if (!ranking.length) h += `<div class="vazio">Ainda sem clientes no ranking.</div>`;
    else h += `<table><tr><th>Cliente</th><th>Unidade</th><th>Pedidos</th><th>Cartão</th><th>Grátis</th></tr>
      ${ranking.map(c => `<tr><td><b>${esc(c.cliente)}</b></td><td>${esc(c.apartamento)}</td><td style="font-family:var(--mono)">${esc(c.pedidos_no_total)}</td>
        <td style="font-family:var(--mono)">${esc(c.carimbos)}/5</td><td style="font-family:var(--mono)">${esc(c.potes_gratis)}</td></tr>`).join("")}</table>`;
    h += `</div>`;
    $("aba-cli").innerHTML = h;
  }

  /* ---------- Cliques gerais ---------- */
  document.addEventListener("click", async e => {
    // Troca de período (Financeiro e Despesas)
    const per = e.target.closest("[data-periodo]");
    if (per) { periodo = per.dataset.periodo; render(); return; }

    // Apagar despesa
    const ap = e.target.closest("[data-apagar]");
    if (ap) {
      if (!confirm(`Apagar a despesa "${ap.dataset.desc}"?`)) return;
      ap.disabled = true;
      const { error } = await db.rpc("painel_despesa_apagar", { p_id: Number(ap.dataset.apagar) });
      if (error) { alert("Não deu para apagar: " + error.message); ap.disabled = false; return; }
      carregar();
      return;
    }

    // Botões dos pedidos
    const b = e.target.closest("[data-acao]"); if (!b) return;
    const id = Number(b.dataset.id), acao = b.dataset.acao;
    const perguntas = {
      cancelar: `Cancelar o pedido nº ${id}?`,
      desfazer_entrega: `Desfazer a entrega do pedido nº ${id}? O carimbo do cliente também volta.`,
      nao_pago: `Marcar o pedido nº ${id} como NÃO pago?`
    };
    if (perguntas[acao] && !confirm(perguntas[acao])) return;
    const antes = b.innerHTML;
    b.disabled = true; b.textContent = "Salvando…";
    const { error } = await db.rpc("painel_acao", { p_id: id, p_acao: acao });
    if (error) { alert("Não deu para salvar: " + error.message); b.disabled = false; b.innerHTML = antes; return; }
    carregar();
  });

  iniciar();
})();
</script>
</body>
</html>
