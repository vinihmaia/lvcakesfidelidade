<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LV CAKES | Bolo de pote</title>
<meta name="description" content="Peça seu bolo de pote LV Cakes e receba no seu bloco. Novidade: cartão fidelidade.">
<meta name="theme-color" content="#FFFBF4">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  html,body{margin:0;background:#FFFBF4}
  #lv{--ink:#2A140C;--soft:#7E6456;--line:rgba(42,20,12,.13);--gold:#A9813F;--gold2:#C9A35F;--tint:#F2E4C9;--paper:#FFFBF4;
      font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;letter-spacing:-0.035em;color:var(--ink);
      background:var(--paper);padding:28px 22px 48px;max-width:560px;margin:0 auto;box-sizing:border-box}
  #lv *{box-sizing:border-box;font-family:inherit}
  #lv button{all:unset;cursor:pointer;box-sizing:border-box}
  #lv button:focus-visible,#lv input:focus-visible,#lv a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  #lv .row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 10px;border-top:1px solid var(--line);transition:background .2s}
  #lv .row.on{background:var(--tint);border-radius:16px;border-top-color:transparent}
  #lv .row.on+.row{border-top-color:transparent}
  #lv .ph{width:72px;height:72px;border-radius:14px;object-fit:cover;object-position:center 48%;display:block}
  #lv .stp{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:17px}
  #lv .fld{display:flex;flex-direction:column;gap:4px}
  #lv .fld label,#lv .fld .lbl{font-size:13px;color:var(--soft)}
  #lv .fld input{all:unset;box-sizing:border-box;width:100%;font-size:22px;padding:6px 0;border-bottom:1.5px solid var(--ink);color:var(--ink)}
  #lv .fld input::placeholder{color:rgba(42,20,12,.3)}
  #lv .blc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
  #lv .blc button{height:46px;border:1.5px solid var(--ink);border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:19px}
  #lv .blc button.on{background:var(--ink);color:var(--paper)}
  #lv .pay{flex:1;text-align:center;padding:12px 6px;border:1.5px solid var(--ink);border-radius:999px;font-size:16px}
  #lv .pay.on{background:var(--ink);color:var(--paper)}
  #lv .err{font-size:13px;color:#B3261E}
  #lv .selo{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(201,163,95,.55);display:flex;align-items:center;justify-content:center;font-size:20px;color:transparent;transition:background .3s,color .3s}
  #lv .selo.on{background:var(--gold2);border:1.5px solid var(--gold2);color:var(--ink)}
  #lv .selo.premio{border-style:solid}
  #lv .selo.premio.on{background:var(--paper);border-color:var(--paper);color:var(--gold)}
  #lv #usar-brinde{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1.5px solid var(--gold);border-radius:999px;color:var(--gold);font-size:17px}
  #lv #usar-brinde.on{background:var(--gold);color:#fff}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (prefers-reduced-motion:reduce){#lv .row,#lv .selo{transition:none}}
</style>
</head>
<body>
<main id="lv">
  <h1 class="sr">LV CAKES, pedidos de bolo de pote</h1>

  <div style="display:flex;align-items:center;gap:14px">
    <div id="logo" style="flex:none"></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:46px;line-height:.9;letter-spacing:-0.05em">LV CAKES</div>
      <div style="font-size:14px;color:var(--soft);margin-top:8px;letter-spacing:-0.01em">Bolo de pote entregue no seu bloco</div>
    </div>
    <a href="https://www.instagram.com/lvcakes_oficial" target="_blank" rel="noopener" aria-label="Instagram da LV Cakes"
       style="color:var(--ink);font-size:28px;line-height:1;text-decoration:none;align-self:flex-start">
      <i class="ti ti-brand-instagram" aria-hidden="true"></i></a>
  </div>

  <!-- CARTÃO FIDELIDADE -->
  <section aria-labelledby="cartao-titulo" style="margin-top:28px;background:var(--ink);color:var(--paper);border-radius:24px;padding:22px 20px 20px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;letter-spacing:0;background:var(--gold2);color:var(--ink);border-radius:999px;padding:4px 11px">Novidade</span>
      <i class="ti ti-crown" aria-hidden="true" style="color:var(--gold2);font-size:22px"></i>
    </div>
    <h2 id="cartao-titulo" style="font-size:34px;line-height:1;margin:14px 0 0;font-weight:500;letter-spacing:-0.05em">Cartão fidelidade</h2>
    <p style="font-size:16px;margin:8px 0 0;color:#E4D3C3;letter-spacing:-0.02em">Compre 5 vezes e ganhe 1 pote grátis.</p>
    <div id="selos" role="img" style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:20px"></div>
    <p id="cartao-status" style="font-size:14px;margin:14px 0 0;color:#E4D3C3;letter-spacing:-0.01em"></p>
  </section>

  <div id="menu" style="margin-top:32px"></div>
  <div class="err" id="e-itens"></div>

  <div style="margin-top:34px;display:flex;flex-direction:column;gap:22px">
    <div class="fld"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" placeholder="Maria"><span class="err" id="e-nome"></span></div>
    <div class="fld">
      <span class="lbl" id="bloco-lbl">Bloco</span>
      <div class="blc" id="blocos" role="radiogroup" aria-labelledby="bloco-lbl"></div>
      <input type="hidden" id="bloco">
      <span class="err" id="e-bloco"></span>
    </div>
    <div class="fld"><label for="apto">Apartamento</label><input id="apto" inputmode="numeric" maxlength="4" placeholder="42"><span class="err" id="e-apto"></span></div>
  </div>

  <div style="margin-top:32px">
    <div style="font-size:13px;color:var(--soft);margin-bottom:10px">Pagamento</div>
    <div style="display:flex;gap:8px" role="radiogroup" aria-label="Forma de pagamento">
      <button class="pay" data-p="Pix" role="radio" aria-checked="false">Pix</button>
      <button class="pay" data-p="Crédito" role="radio" aria-checked="false">Crédito</button>
      <button class="pay" data-p="Dinheiro" role="radio" aria-checked="false">Dinheiro</button>
    </div>
    <div id="nota" style="font-size:14px;color:var(--soft);margin-top:10px"></div>
    <div class="fld" id="troco-box" style="margin-top:12px;display:none"><label for="troco">Troco para quanto? (opcional)</label><input id="troco" inputmode="decimal" placeholder="50"></div>
    <div class="err" id="e-pay"></div>
  </div>

  <div id="brinde-box" style="display:none;margin-top:28px">
    <button id="usar-brinde" aria-pressed="false"><i class="ti ti-gift" aria-hidden="true"></i><span id="usar-brinde-txt">Usar meu pote grátis</span></button>
  </div>

  <div style="margin-top:38px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
    <div style="font-size:15px;color:var(--soft)" id="qtd">Nenhum pote ainda</div>
    <div style="font-size:68px;line-height:.85;letter-spacing:-0.06em" id="total">R$ 0</div>
  </div>

  <button id="enviar" style="margin-top:20px;width:100%;height:80px;border-radius:999px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;letter-spacing:-0.04em">
    <i class="ti ti-brand-whatsapp" aria-hidden="true"></i><span id="enviar-txt">Enviar pedido</span></button>
  <div class="err" id="e-enviar" style="margin-top:8px;text-align:center"></div>
  <div id="ok-envio" style="display:none;margin-top:8px;text-align:center;font-size:14px;color:var(--soft)">Pedido registrado. Seu carimbo já está no cartão.</div>

  <div id="pix" style="display:none;margin-top:18px;border:1.5px solid var(--gold);border-radius:20px;padding:18px">
    <div style="font-size:14px;color:var(--soft)">Pague com Pix</div>
    <div id="pix-total" style="font-size:34px;letter-spacing:-0.05em;margin-top:2px"></div>
    <div id="chave" style="font-size:16px;margin-top:10px;word-break:break-all;letter-spacing:-0.01em;user-select:all"></div>
    <button id="copiar" style="margin-top:14px;width:100%;height:52px;border-radius:999px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px">
      <i class="ti ti-copy" aria-hidden="true"></i><span id="copiar-txt">Copiar chave Pix</span></button>
    <div style="font-size:13px;color:var(--soft);margin-top:10px">Mande o comprovante na conversa do WhatsApp.</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  /* ====== CONFIGURAÇÕES: edite aqui ====== */
  // [id no banco, nome, preço, foto]  -> o id precisa ser igual ao da tabela "sabores"
  const SABORES = [
    ["chocolate", "Chocolate",             15, "chocolate.jpeg"],
    ["prestigio", "Prestígio",             15, "prestigio.jpeg"],
    ["cenoura",   "Cenoura com chocolate", 15, "cenoura.jpeg"],
    ["morango",   "Ninho com morango",     15, "morango.jpeg"],
    ["nutella",   "Ninho com Nutella",     17, "nutella.jpeg"]
  ];
  const BLOCOS = ["1", "2", "3", "4", "5", "6", "7"];
  const LOGO  = "logo.png";
  const FONE  = "5511955862368";
  const CHAVE = "viniciusmaia_2022@hotmail.com";

  // Banco de dados (Supabase). Use só a chave publishable, nunca a secret.
  const SUPABASE_URL = "https://kbwhmketsipuciygklkg.supabase.co";
  const SUPABASE_KEY = "sb_publishable_SaOAF_gTTG9tqDTo2Dax9g_aZ4NA-JQ";
  /* ======================================== */

  const db = (SUPABASE_URL && SUPABASE_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const q = SABORES.map(() => 0);
  let pag = "", usarBrinde = false, enviando = false, cartao = null, consulta = 0;
  const $ = id => document.getElementById(id);
  const brl = v => v.toLocaleString("pt-BR", {style:"currency", currency:"BRL", minimumFractionDigits: v % 1 ? 2 : 0});
  $("chave").textContent = CHAVE;

  /* ---------- Fotos e logo ---------- */
  function img(src, alt, cls, fallback){
    const i = document.createElement("img");
    i.src = src; i.alt = alt; i.className = cls; i.loading = "lazy";
    i.onerror = () => i.replaceWith(fallback());
    return i;
  }
  const logo = img(LOGO, "Logo LV Cakes", "", () => {
    const d = document.createElement("div");
    d.setAttribute("aria-label", "Logo LV Cakes");
    d.style.cssText = "width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font:italic 500 30px 'Cormorant Garamond',serif";
    d.textContent = "LV";
    return d;
  });
  logo.loading = "eager";
  logo.style.cssText = "width:64px;height:64px;border-radius:50%;object-fit:cover;display:block";
  $("logo").appendChild(logo);

  /* ---------- Cartão fidelidade ---------- */
  const selos = $("selos");
  for (let i = 0; i < 6; i++) {
    const s = document.createElement("div");
    s.className = "selo" + (i === 5 ? " premio" : "");
    s.innerHTML = `<i class="ti ${i === 5 ? "ti-gift" : "ti-cake"}" aria-hidden="true"></i>`;
    selos.appendChild(s);
  }

  function renderCartao(){
    const c = cartao ? cartao.carimbos : 0;
    const b = cartao ? cartao.brindes_disponiveis : 0;
    [...selos.children].forEach((s, i) => s.classList.toggle("on", i < 5 ? i < c : b > 0));
    let txt;
    if (!cartao) {
      txt = db ? "Escolha o bloco e digite o apartamento no pedido para ver seus carimbos."
               : "Cada pedido vale um carimbo.";
    } else if (b > 0) {
      txt = `Você tem ${b} pote${b > 1 ? "s" : ""} grátis. Use no pedido abaixo.`;
    } else {
      const f = 5 - c;
      txt = `Falta${f > 1 ? "m" : ""} ${f} pedido${f > 1 ? "s" : ""} para o seu pote grátis.`;
    }
    $("cartao-status").textContent = txt;
    selos.setAttribute("aria-label", cartao
      ? `${c} de 5 carimbos${b > 0 ? ", pote grátis disponível" : ""}`
      : "Cartão com 5 carimbos e 1 pote grátis");
    $("brinde-box").style.display = b > 0 ? "block" : "none";
    if (!(b > 0)) setBrinde(false);
  }

  async function carregarCartao(){
    if (!db) return;
    const bloco = $("bloco").value.trim(), apto = $("apto").value.trim();
    const minha = ++consulta;
    if (!bloco || !apto) { cartao = null; renderCartao(); return; }
    try {
      const { data, error } = await db.rpc("consultar_cartao", { p_bloco: bloco, p_apto: apto });
      if (minha !== consulta) return;           // chegou uma consulta mais nova
      if (!error && data && data[0]) { cartao = data[0]; renderCartao(); }
    } catch (e) { /* sem internet: o cartão só não atualiza */ }
  }

  function setBrinde(v){
    usarBrinde = v;
    $("usar-brinde").classList.toggle("on", v);
    $("usar-brinde").setAttribute("aria-pressed", v);
    $("usar-brinde").querySelector("i").className = "ti " + (v ? "ti-check" : "ti-gift");
    $("usar-brinde-txt").textContent = v ? "Pote grátis aplicado" : "Usar meu pote grátis";
    calc();
  }
  $("usar-brinde").onclick = () => setBrinde(!usarBrinde);

  /* ---------- Cardápio ---------- */
  const menu = $("menu");
  SABORES.forEach(([id, n, p, f], i) => {
    const r = document.createElement("div"); r.className = "row";
    r.appendChild(img(f, "Bolo de pote " + n, "ph", () => {
      const d = document.createElement("div"); d.className = "ph"; d.style.background = "var(--tint)"; return d;
    }));
    const t = document.createElement("div");
    t.innerHTML = `<div style="font-size:20px;line-height:1.1">${n}</div><div style="font-size:14px;color:var(--soft);margin-top:3px">${brl(p)}</div>`;
    r.appendChild(t);
    const s = document.createElement("div"); s.style.cssText = "display:flex;align-items:center;gap:8px";
    s.innerHTML = `<button class="stp" aria-label="Remover ${n}"><i class="ti ti-minus" aria-hidden="true"></i></button><span style="min-width:20px;text-align:center;font-size:20px" aria-live="polite">0</span><button class="stp" aria-label="Adicionar ${n}"><i class="ti ti-plus" aria-hidden="true"></i></button>`;
    r.appendChild(s);
    const [menos, mais] = s.querySelectorAll("button"), cont = s.querySelector("span");
    const up = d => {
      q[i] = Math.max(0, Math.min(20, q[i] + d));
      cont.textContent = q[i];
      r.classList.toggle("on", q[i] > 0);
      $("e-itens").textContent = ""; $("e-enviar").textContent = "";
      $("pix").style.display = "none"; $("ok-envio").style.display = "none";
      calc();
    };
    menos.onclick = () => up(-1); mais.onclick = () => up(1);
    menu.appendChild(r);
  });

  function calc(){
    const n = q.reduce((s, x) => s + x, 0);
    const sub = q.reduce((s, x, i) => s + x * SABORES[i][2], 0);
    let desc = 0;
    if (usarBrinde && n) desc = Math.min(...SABORES.filter((_, i) => q[i]).map(x => x[2]));
    $("qtd").textContent = n ? `${n} pote${n > 1 ? "s" : ""}${desc ? ", 1 grátis" : ""}` : "Nenhum pote ainda";
    $("total").textContent = brl(sub - desc);
    return { n, sub, desc, total: sub - desc };
  }

  /* ---------- Botões de bloco (1 a 7) ---------- */
  const blocos = $("blocos");
  BLOCOS.forEach(b => {
    const btn = document.createElement("button");
    btn.textContent = b;
    btn.setAttribute("role", "radio");
    btn.setAttribute("aria-checked", "false");
    btn.setAttribute("aria-label", "Bloco " + b);
    btn.onclick = () => escolherBloco(b, true);
    blocos.appendChild(btn);
  });
  function escolherBloco(b, avisar){
    $("bloco").value = b;
    [...blocos.children].forEach(x => {
      const on = x.textContent === b;
      x.classList.toggle("on", on);
      x.setAttribute("aria-checked", on);
    });
    $("e-bloco").textContent = "";
    if (avisar) $("bloco").dispatchEvent(new Event("input"));
  }

  /* ---------- Pagamento ---------- */
  const notas = {
    "Pix": "A chave Pix aparece quando você enviar o pedido.",
    "Crédito": "Enviamos o link de pagamento no WhatsApp.",
    "Dinheiro": "Pagamento na entrega."
  };
  document.querySelectorAll(".pay").forEach(b => b.onclick = () => {
    pag = b.dataset.p;
    document.querySelectorAll(".pay").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    $("nota").textContent = notas[pag];
    $("troco-box").style.display = pag === "Dinheiro" ? "flex" : "none";
    $("e-pay").textContent = "";
    if (pag !== "Pix") $("pix").style.display = "none";
  });

  /* ---------- Dados do cliente (lembrados no celular) ---------- */
  let timer;
  const soNumeros = v => v.replace(/\D/g, "").slice(0, 4);
  ["nome", "bloco", "apto"].forEach(k => {
    try {
      const v = localStorage.getItem("lv_" + k);
      if (v) {
        if (k === "bloco") { const d = String(Number(v.replace(/\D/g, ""))); if (BLOCOS.includes(d)) escolherBloco(d, false); }
        else if (k === "apto") $(k).value = soNumeros(v);
        else $(k).value = v;
      }
    } catch(e){}
    $(k).addEventListener("input", () => {
      if (k === "apto") { const c = soNumeros($(k).value); if (c !== $(k).value) $(k).value = c; }
      $("e-" + k).textContent = "";
      if (k !== "nome") { clearTimeout(timer); timer = setTimeout(carregarCartao, 500); }
    });
  });

  function abrir(url, janela){
    if (janela && !janela.closed) { janela.location.href = url; return; }
    const w = window.open(url, "_blank");
    if (!w) window.location.href = url;
  }

  /* ---------- Enviar ---------- */
  $("enviar").onclick = async () => {
    if (enviando) return;
    const nome = $("nome").value.trim(), bloco = $("bloco").value.trim(), apto = $("apto").value.trim();
    let ok = true;
    $("e-enviar").textContent = "";
    if (!q.some(x => x)) { $("e-itens").textContent = "Escolha pelo menos um pote."; ok = false; }
    if (!nome)  { $("e-nome").textContent  = "Digite seu nome."; ok = false; }
    if (!bloco) { $("e-bloco").textContent = "Escolha o seu bloco."; ok = false; }
    if (!apto)  { $("e-apto").textContent  = "Digite o número do apartamento."; ok = false; }
    if (!pag)   { $("e-pay").textContent   = "Escolha a forma de pagamento."; ok = false; }
    if (!ok) return;

    try { ["nome","bloco","apto"].forEach(k => localStorage.setItem("lv_" + k, $(k).value.trim())); } catch(e){}

    let { desc, total } = calc();
    const troco = $("troco").value.trim();
    let pedidoId = null, naoRegistrado = false, infoCartao = null;

    // Abre a aba já no clique (senão o navegador bloqueia), e só depois coloca o link
    const janela = db ? window.open("", "_blank") : null;

    if (db) {
      enviando = true; $("enviar-txt").textContent = "Enviando…";
      try {
        const itens = SABORES.map(([id], i) => q[i] ? { sabor: id, qtd: q[i] } : null).filter(Boolean);
        const { data, error } = await db.rpc("criar_pedido", {
          p_nome: nome, p_bloco: bloco, p_apto: apto, p_itens: itens,
          p_pagamento: pag, p_troco: troco || null, p_usar_brinde: usarBrinde
        });
        if (error) {
          if (error.code === "P0001") {           // recusado pelo banco (ex.: limite diário, sem brinde)
            if (janela) janela.close();
            $("e-enviar").textContent = error.message + ".";
            enviando = false; $("enviar-txt").textContent = "Enviar pedido";
            carregarCartao();
            return;
          }
          naoRegistrado = true;
        } else {
          pedidoId = data.id; total = Number(data.total); desc = Number(data.desconto);
          // Busca como ficou o cartão, para avisar a loja na mensagem
          try {
            const r = await db.rpc("consultar_cartao", { p_bloco: bloco, p_apto: apto });
            if (!r.error && r.data && r.data[0]) infoCartao = r.data[0];
          } catch (e) {}
        }
      } catch (e) { naoRegistrado = true; }
      enviando = false; $("enviar-txt").textContent = "Enviar pedido";
    }

    const itensTxt = SABORES.map(([, n, p], i) => q[i] ? `${q[i]}x ${n} (${brl(q[i] * p)})` : null).filter(Boolean);
    let pg = pag === "Crédito" ? "Crédito (enviar link de pagamento)" : pag;
    if (pag === "Dinheiro" && troco) pg += ` (troco para R$ ${troco})`;

    let linhaCartao = [];
    if (infoCartao) {
      linhaCartao = [infoCartao.brindes_disponiveis > 0
        ? "Cartão fidelidade: completo, pote grátis liberado"
        : `Cartão fidelidade: ${infoCartao.carimbos} de 5`];
    }

    const msg = [
      `*Pedido LV Cakes${pedidoId ? " nº " + pedidoId : ""}*`, "",
      ...itensTxt,
      ...(desc ? [`Pote grátis do cartão fidelidade: -${brl(desc)}`] : []),
      "", `*Total: ${brl(total)}*`, "",
      `Nome: ${nome}`, `Bloco ${bloco}, apto ${apto}`, `Pagamento: ${pg}`,
      ...linhaCartao,
      ...(naoRegistrado ? ["", "(pedido não registrado no sistema)"] : [])
    ].join("\n");

    if (pag === "Pix" && total > 0) {
      $("pix-total").textContent = brl(total);
      $("copiar-txt").textContent = "Copiar chave Pix";
      $("pix").style.display = "block";
    }
    if (db && pedidoId) {
      $("ok-envio").style.display = "block";
      setBrinde(false);
      if (infoCartao) { cartao = infoCartao; renderCartao(); } else carregarCartao();
    }

    abrir(`https://wa.me/${FONE}?text=${encodeURIComponent(msg)}`, janela);
  };

  /* ---------- Copiar chave Pix ---------- */
  $("copiar").onclick = () => {
    const done = () => $("copiar-txt").textContent = "Chave copiada";
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = CHAVE; ta.style.cssText = "position:absolute;left:-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); }
      catch(e) { $("copiar-txt").textContent = "Segure a chave para copiar"; }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(CHAVE).then(done, fallback);
    else fallback();
  };

  renderCartao();
  calc();
  carregarCartao();
})();
</script>
</body>
</html>
